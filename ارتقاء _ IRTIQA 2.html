<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ارتقاء | IRTIQA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{--p:#00A3A1;--p2:#007C8C;--l:#E2D6FF;--l2:#F2ECFF;--bg:#FAF8FF;--ink:#12302F;--mu:#587070;--bd:#DCD2F3;--fs:1;--g1:#00B8A9;--g2:#7C5CFF;--ok:#1E8F5A;--wa:#B7791F;--er:#C2413B;color-scheme:light;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.7 Tajawal,"Segoe UI",Tahoma,sans-serif}
header{background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;padding:8px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;color:var(--p)}.logo i{font-style:normal;background:var(--p);color:#fff;width:34px;height:34px;border-radius:11px 11px 11px 3px;display:grid;place-items:center}
.logo small{display:block;font-size:11px;color:var(--mu);font-weight:500;line-height:1}
nav{display:flex;gap:4px;margin-inline-start:auto;overflow-x:auto}nav button{border:0;background:none;padding:8px 14px;border-radius:10px;font:inherit;color:var(--mu);cursor:pointer}
nav button.on{background:var(--l);color:var(--p2);font-weight:700}
main{max-width:1060px;margin:auto;padding:20px 16px 60px}main,header{zoom:var(--fs)}
h1{font-size:26px;margin:0 0 4px}h2{font-size:18px;margin:0 0 10px}h3{font-size:16px;margin:0 0 6px}
.card{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(14,90,92,.05)}
.g{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g5{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.hero{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:22px;padding:22px;margin-bottom:16px}.hero p{margin:2px 0;opacity:.9}
.stat{background:var(--l2);border-radius:14px;padding:12px}.stat b{font-size:22px;color:var(--p);display:block}
.svc{cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .15s}.svc:hover{transform:translateY(-2px)}.svc .ic{font-size:26px;width:48px;height:48px;border-radius:14px;background:var(--l);display:grid;place-items:center}
.svc.star{border:2px solid var(--p)}
button.b,a.b{background:var(--p);color:#fff;border:0;border-radius:11px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
button.s{background:var(--l);color:var(--p2);border:0;border-radius:11px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}
button.d{background:#fff;color:var(--er);border:1px solid #efc4c1;border-radius:9px;padding:4px 10px;font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9b86d6;outline-offset:2px}
input,select,textarea{width:100%;border:1px solid var(--bd);border-radius:10px;padding:9px 11px;font:inherit;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 2px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.row .f{flex:1 1 150px}
.bar{height:9px;background:var(--l);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p);border-radius:9px}
.tag{display:inline-block;font-size:12px;padding:1px 10px;border-radius:99px;background:var(--l);color:var(--p2)}
.t-ok{background:#DDF3E8;color:var(--ok)}.t-wa{background:#FCEFD3;color:var(--wa)}.t-er{background:#FADDDB;color:var(--er)}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}.tabs button{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:5px 14px;font:inherit;cursor:pointer}.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.note{background:#FFF8E6;border:1px solid #F2DFA7;border-radius:12px;padding:9px 12px;font-size:13px;margin:8px 0}
.empty{text-align:center;color:var(--mu);padding:22px}.item{border-top:1px solid var(--bd);padding:10px 0}.item:first-child{border-top:0}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--bd);padding:7px 9px;text-align:start;vertical-align:top}th{background:var(--l2)}
.tw{overflow-x:auto}.back{margin-bottom:10px}#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;display:none;z-index:9}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:6px;min-width:780px}.grid7>div{background:var(--l2);border-radius:10px;padding:6px;min-height:80px;font-size:12px}
.opt{display:block;width:100%;text-align:start;margin:5px 0;border:1px solid var(--bd);background:#fff;border-radius:10px;padding:9px;font:inherit;cursor:pointer}.opt.ok{background:#DDF3E8;border-color:var(--ok)}.opt.no{background:#FADDDB;border-color:var(--er)}
.dots{display:flex;gap:6px;align-items:flex-end;height:80px}.dots i{flex:1;background:var(--p);border-radius:6px 6px 0 0;min-height:4px;font-style:normal;color:#fff;font-size:11px;text-align:center}
@media print{header,.noprint,#toast{display:none!important}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div class="logo"><i>ا</i><div>ارتقاء | IRTIQA<small>من أول درس، إلى أفضل إنجاز</small></div></div>
<nav id="nav"></nav><button class="s" id="lg" data-a="lang">English</button></header><main id="app"></main><div id="toast"></div>
<script>
const K='namaa_v1',$=s=>document.querySelector(s);
let S={name:'',grade:'',stage:'',lang:'ar',fs:1,theme:'bright',focus:0,tasks:[],exams:[],classes:[],teams:[],lessons:[],results:[],reports:[],log:[],remind:true,demo:false};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('تعذّر الحفظ في هذا المتصفح؛ البيانات مؤقتة.')}};
const uid=()=>Math.random().toString(36).slice(2,9);const genCode=()=>Math.random().toString(36).slice(2,8).toUpperCase();
const pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TD=iso(new Date()),addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const dd=(a,b)=>Math.round((new Date(a+'T12:00')-new Date(b+'T12:00'))/864e5);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const fmt=s=>new Date(s+'T12:00').toLocaleDateString('ar-SA',{weekday:'long',day:'numeric',month:'long'});
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
function log(m){S.log.unshift({d:TD,t:new Date().toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'}),m});S.log=S.log.slice(0,40)}
let V='home',sub={},UI={};
const NAV=[['home','الرئيسية'],['services','الخدمات'],['progress','الإنجازات'],['settings','الإعدادات']];
const SV={team:['👥','فريق','للمشاريع الجماعية: قسّمي المهام بعدالة وتابعي الإنجاز.'],understand:['💡','افهم','لخّصي الدرس واحصلي على أسئلة وشرح مبسّط.'],fix:['📌','ثبّت','جداول مراجعة واختبارات قصيرة تكشف نقاط ضعفك.'],plan:['🗓️','خطّتي','جدولك واختباراتك وواجباتك وتذكيراتك في مكان واحد.'],master:['✅','أتقن','راجعي مشروعك وفق متطلباته قبل التسليم.']};
function go(v){V=v;UI={};window.scrollTo(0,0);R()}
const tasksAll=()=>S.tasks.concat(S.teams.flatMap(t=>t.tasks.map(x=>({...x,title:x.title+' ('+t.name+')',done:x.st==='مكتملة',due:x.due,team:1}))));
const late=t=>!t.done&&t.due<TD;
const stOf=x=>x.st!=='مكتملة'&&x.due<TD?'متأخرة':x.st;
const pct=t=>t.tasks.length?Math.round(t.tasks.filter(x=>x.st==='مكتملة').length/t.tasks.length*100):0;
function R(){
 $('#nav').innerHTML=NAV.map(([k,n])=>`<button class="${(V===k||(k==='services'&&SV[V]))?'on':''}" data-a="go" data-v="${k}">${n}</button>`).join('');
 $('#lg').textContent=S.lang==='en'?'العربية':'English';const f=S.name?{home,services,progress,settings,team,understand,fix,plan,master}[V]:onb;$('#app').innerHTML=f();applyLang();applyTheme();
}
const back=()=>`<button class="s back" data-a="go" data-v="services">‹ كل الخدمات</button>`;
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
const hdr=k=>`${back()}<h1>${SV[k][0]} <span>${SV[k][1]}</span></h1><p style="color:var(--mu);margin:0 0 12px">${SV[k][2]}</p>`;
const subj=()=>['الرياضيات','العلوم','اللغة العربية','اللغة الإنجليزية','الاجتماعيات','الحاسب'].map(x=>`<option>${x}</option>`).join('');
const stt=s=>`<span class="tag ${{'مكتملة':'t-ok','متأخرة':'t-er','قيد التنفيذ':'t-wa','مكتمل':'t-ok','ناقص':'t-er','يحتاج إلى تحسين':'t-wa'}[s]||''}">${s}</span>`;

/* ---------- Home ---------- */
function home(){
 const all=tasksAll(),today=all.filter(t=>!t.done&&t.due===TD),lt=all.filter(late);
 const ev=S.exams.map(e=>({n:'اختبار '+e.subject,d:e.date})).concat(all.filter(t=>!t.done).map(t=>({n:t.title,d:t.due}))).filter(e=>e.d>=TD).sort((a,b)=>a.d.localeCompare(b.d))[0];
 const wk=all.filter(t=>t.due>=addD(TD,-6)&&t.due<=addD(TD,6)),wp=wk.length?Math.round(wk.filter(t=>t.done).length/wk.length*100):0;
 const next=all.filter(t=>!t.done).sort((a,b)=>(late(b)-late(a))||a.due.localeCompare(b.due))[0];
 const dn=S.log.filter(l=>l.d===TD);
 return `<div class="hero"><p>${fmt(TD)}</p><h1>أهلًا ${esc(S.name||'بك')}${S.grade?' — '+esc(S.grade):''}${S.stage?' · '+esc(S.stage):''} 👋</h1><p>معكِ تنمو المعرفة، تزدهر الأحلام 🌱</p><p>من أول درس، إلى أفضل إنجاز.</p></div>
 ${!S.name&&!S.tasks.length&&!S.teams.length?`<div class="card note noprint" style="margin-bottom:14px">التطبيق فارغ الآن. أضيفي اسمك من <a href="#" data-a="go" data-v="settings">الإعدادات</a>، أو <button class="s" data-a="demo">حمّلي بيانات تجريبية للعرض</button></div>`:''}
 <div class="g g2" style="margin-bottom:16px">
  <div class="card"><div class="row"><div class="stat f"><b>${today.length}</b>مهام اليوم</div><div class="stat f"><b>${lt.length}</b>مهام متأخرة</div><div class="stat f"><b>${wp}%</b>إنجاز الأسبوع</div></div>${bar(wp)}
   <p style="margin:10px 0 0"><b>الأقرب:</b> ${ev?esc(ev.n)+' — '+fmt(ev.d)+' (بعد '+dd(ev.d,TD)+' يوم)':'لا توجد مواعيد قادمة.'}</p></div>
  <div class="card"><h3>خطوتك التالية</h3>${next?`<p style="margin:0 0 8px">${late(next)?'⚠️ ':''}<b>${esc(next.title)}</b><br><span style="color:var(--mu)">التسليم ${fmt(next.due)}</span></p>${next.team?'':`<button class="b" data-a="done" data-id="${next.id}">تم إنجازها ✓</button>`}`:`<p class="empty" style="padding:6px">لا مهام معلّقة. أضيفي واجبًا من «خطّتي».</p>`}</div></div>
 <h2>الخدمات</h2><div class="g g5">${Object.entries(SV).map(([k,v])=>`<div class="card svc ${k==='master'?'star':''}" data-a="go" data-v="${k}" tabindex="0" role="button"><div class="ic">${v[0]}</div><h3>${v[1]}</h3><span style="color:var(--mu);font-size:13px">${v[2]}</span><button class="${k==='master'?'b':'s'}" style="margin-top:auto">افتحي ${v[1]}</button></div>`).join('')}</div>
 <div class="card noprint" style="margin-top:16px"><div class="row"><div class="f"><h3>مؤقّت التركيز</h3><span style="color:var(--mu)">25 دقيقة مذاكرة بلا مقاطعة · جلسات مكتملة: ${S.focus||0}</span></div><b id="tm" style="font-size:28px;color:var(--p)">${mmss(TM.left)}</b><button class="b" data-a="tstart">ابدئي</button><button class="s" data-a="tpause">إيقاف</button><button class="s" data-a="treset">إعادة</button></div></div>
 <h2 style="margin-top:18px">ماذا أنجزتِ اليوم؟</h2><div class="card">${dn.length?dn.map(l=>`<div class="item">✔ ${esc(l.m)} <span style="color:var(--mu)">${l.t}</span></div>`).join(''):'<div class="empty">لم يُسجَّل إنجاز اليوم بعد. أنهي مهمة أو اختبارًا قصيرًا وسيظهر هنا.</div>'}</div>`}
function services(){return `<h1>الخدمات</h1><div class="g g5">${Object.entries(SV).map(([k,v])=>`<div class="card svc" data-a="go" data-v="${k}"><div class="ic">${v[0]}</div><h3>${v[1]}</h3><span style="color:var(--mu);font-size:13px">${v[2]}</span></div>`).join('')}</div>`}

/* ---------- Team ---------- */
function team(){
 if(sub.team){const t=S.teams.find(x=>x.id===sub.team);if(t)return teamDet(t);sub.team=0}
 return hdr('team')+`<div class="row noprint"><button class="b" data-a="show" data-k="tnew">إنشاء فريق جديد</button><button class="s" data-a="show" data-k="tjoin">الانضمام إلى فريق</button></div>
 ${UI.tjoin?`<div class="card" style="margin:10px 0"><label>رمز الفريق</label><div class="row"><input id="jc" class="f" placeholder="مثال: AB12CD"><button class="b" data-a="join">انضمام</button></div></div>`:''}
 ${UI.tnew?`<div class="card" style="margin:10px 0"><h3>مشروع جماعي جديد</h3><div class="row"><div class="f"><label>اسم المشروع</label><input id="tn"></div><div class="f"><label>المادة</label><select id="ts">${subj()}</select></div><div class="f"><label>موعد التسليم</label><input id="td" type="date" min="${TD}"></div><div class="f"><label>رمز الفريق (اختاري رمزًا أو اتركي المقترح)</label><input id="tcode" value="${genCode()}" maxlength="10"></div></div>
 <label>وصف المشروع وموضوعه</label><textarea id="tdesc" rows="2"></textarea><label>تعليمات المعلمة</label><textarea id="ti" rows="2"></textarea>
 <label>أسماء العضوات (اسم في كل سطر، ويُحسب العدد تلقائيًا؛ ويمكن كتابة الدور المفضّل بعد شرطة: سارة - تصميم)</label><textarea id="tm" rows="4"></textarea>
 <label>المخرجات المطلوبة (افصلي بفاصلة)</label><input id="to" value="عرض تقديمي, تقرير"><div class="row" style="margin-top:10px"><button class="b" data-a="mkteam">إنشاء المشروع</button></div></div>`:''}
 <h2 style="margin-top:16px">فرقي</h2>${S.teams.length?S.teams.map(t=>{const od=t.tasks.filter(x=>stOf(x)==='متأخرة').length;return `<div class="card" style="margin-bottom:10px"><div class="row"><h3 class="f">${esc(t.name)} <span class="tag">${esc(t.subject)}</span> <span class="tag t-wa">الرمز: ${esc(t.code||'—')}</span></h3><button class="s" data-a="opent" data-id="${t.id}">فتح المشروع</button></div>${bar(pct(t))}<div style="margin-top:6px;color:var(--mu)">الإنجاز ${pct(t)}% · التسليم ${fmt(t.due)} · العضوات: ${t.members.map(m=>esc(m.n)).join('، ')} ${od?`<span class="tag t-er">${od} متأخرة</span>`:''}</div></div>`}).join(''):'<div class="card empty">لا توجد فرق بعد. اضغطي «إنشاء فريق جديد» لبدء مشروعك الأول.</div>'}`}
function teamDet(t){
 const p=t.prop;
 return `<button class="s back" data-a="clr">‹ كل الفرق</button><h1>${esc(t.name)}</h1><p><span class="tag t-wa">رمز الفريق: ${esc(t.code||'—')}</span> شاركيه مع زميلاتك للانضمام</p><p style="color:var(--mu)">${esc(t.desc||'')} ${t.instr?'— تعليمات المعلمة: '+esc(t.instr):''}</p>
 <div class="card">${bar(pct(t))}<p style="margin:6px 0">إنجاز المشروع <b>${pct(t)}%</b> · التسليم ${fmt(t.due)} · غير المكتملة: ${t.tasks.filter(x=>x.st!=='مكتملة').length}</p>
 <div class="row noprint"><button class="b" data-a="split" data-id="${t.id}">قسّمي المهام بذكاء</button><button class="s" data-a="chk" data-id="${t.id}">افحص اكتمال المشروع</button><button class="s" data-a="toMaster" data-id="${t.id}">انقلي المتطلبات إلى «أتقن»</button></div></div>
 ${p?`<div class="card" style="margin-top:12px;border-color:var(--p)"><h3>اقتراح التوزيع (تجريبي — قائم على قواعد محلية لا ذكاء اصطناعي)</h3><p class="note">عدّلي المسؤولة والموعد، ثم اعتمدي. لن يُطبَّق شيء قبل موافقتك.</p>
 <div class="tw"><table><tr><th>المهمة</th><th>المسؤولة</th><th>الموعد</th><th>تعتمد على</th></tr>${p.map((x,i)=>`<tr><td>${esc(x.title)}</td><td><select data-pi="${i}" data-f="who">${t.members.map(m=>`<option ${m.n===x.who?'selected':''}>${esc(m.n)}</option>`).join('')}</select></td><td><input type="date" data-pi="${i}" data-f="due" value="${x.due}" max="${t.due}"></td><td>${x.dep?esc(x.dep):'—'}</td></tr>`).join('')}</table></div>
 <div class="row" style="margin-top:8px"><button class="b" data-a="approve" data-id="${t.id}">اعتماد التوزيع</button><button class="s" data-a="dismiss" data-id="${t.id}">إلغاء</button></div></div>`:''}
 ${UI.chk?`<div class="card" style="margin-top:12px"><h3>نتيجة فحص الاكتمال</h3>${UI.chk}</div>`:''}
 <h2 style="margin-top:16px">لوحة المتابعة</h2>${t.tasks.length?`<div class="card tw"><table><tr><th>المهمة</th><th>المسؤولة</th><th>الموعد</th><th>الحالة</th><th>ملاحظات / ملف</th><th></th></tr>${t.tasks.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.who)}</td><td>${x.due}</td><td>${stt(stOf(x))}<br><select data-tt="${t.id}" data-id="${x.id}" data-f="st">${['لم تبدأ','قيد التنفيذ','مكتملة'].map(s=>`<option ${x.st===s?'selected':''}>${s}</option>`).join('')}</select></td><td><input data-tt="${t.id}" data-id="${x.id}" data-f="note" value="${esc(x.note||'')}" placeholder="ملاحظة"><input type="file" data-tt="${t.id}" data-id="${x.id}" data-f="file">${x.file?'<small>📎 '+esc(x.file)+'</small>':''}</td><td><button class="d" data-a="deltask" data-t="${t.id}" data-id="${x.id}">حذف</button></td></tr>`).join('')}</table></div>`:'<div class="card empty">لا مهام بعد. استخدمي «قسّمي المهام بذكاء» لاقتراح التوزيع.</div>'}
 ${t.files&&t.files.length?`<h2 style="margin-top:16px">ملفات المشروع</h2><div class="card">${t.files.map(f=>`<div class="item">📄 ${esc(f.n)} <span class="tag">${f.d}</span></div>`).join('')}</div>`:''}
 <div class="row" style="margin-top:14px"><button class="d" data-a="delteam" data-id="${t.id}">حذف الفريق</button></div>`}

/* ---------- Understand ---------- */
const words=s=>s.split(/\s+/).filter(Boolean);
function parse(text){
 const sents=text.split(/[.؟?!\n]+/).map(s=>s.trim()).filter(s=>words(s).length>=5);
 const key=w=>words(w).map(x=>x.replace(/[،,:؛()«»"]/g,'')).filter(x=>x.length>3).sort((a,b)=>b.length-a.length)[0];
 const items=sents.map(s=>({s,k:key(s)})).filter(i=>i.k);
 const defs=sents.filter(s=>/(هو|هي|يعرّف|يُعرّف|تعريف|يسمى|تسمى|يُسمى|تُسمى|:)/.test(s));
 return{sents,items,defs,words:words(text).length};
}

function quiz(q){

 return `<div class="card"><div class="row"><b class="f">سؤال ${q.i+1} من ${q.qs.length}</b><span class="tag">${q.mode}</span></div>${bar(q.i/q.qs.length*100)}<h3 style="margin-top:10px">${esc(x.q)}</h3>${x.o.map((o,j)=>`<button class="opt ${pr?(j===x.c?'ok':j===ans?'no':''):(ans===j?'ok':'')}" data-a="ans" data-j="${j}">${esc(o)}</button>`).join('')}
 ${pr?`<p class="note">${ans===x.c?'إجابة صحيحة 👏':'الصحيحة: '+esc(x.o[x.c])+'. '+esc(x.why)}</p>`:''}<button class="b" data-a="nextq" ${ans===undefined?'disabled style="opacity:.5"':''}>${q.i+1===q.qs.length?'إنهاء وتصحيح':'التالي'}</button></div>`}
function makeQs(l,n,lv,focus){
 const d=parse(l.text),pool=d.items,ks=[...new Set(pool.map(i=>i.k))];
 let src=focus&&focus.length?pool.filter(i=>focus.includes(i.k)):pool;if(!src.length)src=pool;
 src=src.slice().sort(()=>Math.random()-.5);const tfq=src.map((i,j)=>{const t=j%2===0,o2=ks.filter(k=>k!==i.k),w=o2[Math.floor(Math.random()*o2.length)],ok=t||!w;return{q:'صح أم خطأ: '+(ok?i.s:i.s.replace(i.k,w)),o:['صح','خطأ'],c:ok?0:1,k:i.k,why:'الجملة الصحيحة في الدرس: «'+i.s+'»'}});
 const mq=src.map(i=>{const dist=ks.filter(k=>k!==i.k).sort(()=>Math.random()-.5).slice(0,lv==='سهل'?2:3);const o=[i.k,...dist].sort(()=>Math.random()-.5);
 return{q:'أكملي: '+i.s.replace(i.k,'_____'),o,c:o.indexOf(i.k),k:i.k,why:'الجملة الأصلية في الدرس: «'+i.s+'»'}});return mq.concat(tfq).sort(()=>Math.random()-.5).slice(0,n);
}

function check(txt,crit){
 const ws=words(txt),F=[];let n=0;const add=(t,st,why,fix,ex)=>F.push({id:n++,t,st,why,fix,ex});
 crit.split('\n').map(s=>s.trim()).filter(Boolean).forEach(c=>{const ks=words(c).map(x=>x.replace(/[،.:]/g,'')).filter(x=>x.length>3),h=ks.filter(k=>txt.includes(k.slice(0,Math.max(3,k.length-1)))).length;const st=!ks.length?'يحتاج إلى تحقق':h/ks.length>=.6?'مكتمل':h?'يحتاج إلى تحسين':'ناقص';add('المتطلب: '+c,st,st==='مكتمل'?'وُجدت كلمات المتطلب في النص (فحص كلمات مفتاحية فقط).':'لم تظهر كلمات المتطلب بوضوح في النص.','أضيفي فقرة أو قسمًا يغطّي هذا المتطلب صراحةً.','مثال: ابدئي الفقرة بعنوان «'+c.slice(0,30)+'» ثم اشرحيه في 3 جمل.')});
 if(ws.length<120)add('طول المحتوى','يحتاج إلى تحسين','عدد الكلمات '+ws.length+' فقط.','وسّعي الأفكار بأمثلة وتفاصيل.','مثال: بعد كل فكرة أضيفي «مثلًا...».');
 const fr={};ws.filter(w=>w.length>4).forEach(w=>fr[w]=(fr[w]||0)+1);const rp=Object.entries(fr).filter(([w,c])=>c>=5).map(([w])=>w);
 if(rp.length)add('تكرار','يحتاج إلى تحسين','تكررت كلمات: '+rp.slice(0,4).join('، ')+' خمس مرات أو أكثر.','استبدلي بعض التكرارات بمرادفات أو ضمائر.','مثال: بدل تكرار الكلمة، قولي «هذه الظاهرة».');
 if(/ {2,}/.test(txt)||/ [،.]/.test(txt))add('تنسيق وعلامات ترقيم','يحتاج إلى تحسين','مسافات زائدة أو مسافة قبل علامة الترقيم.','احذفي المسافة الزائدة قبل الفاصلة والنقطة.','«الدرس ،» ← «الدرس،»');
 if(!/مصدر|مصادر|مراجع|المراجع|http/.test(txt))add('المصادر والتوثيق','يحتاج إلى تحقق','لم تُرصد قائمة مصادر. لا يمكن التحقق من صحة المصادر أصلًا هنا.','أضيفي قسم «المصادر» إن كانت المعلمة تشترطه.','المصدر: عنوان الكتاب، المؤلف، السنة.');
 if(!/\n\s*\n/.test(txt)&&ws.length>150)add('ترتيب الأفكار','يحتاج إلى تحسين','النص كتلة واحدة بلا فقرات.','قسّميه إلى فقرات: مقدمة، عرض، خاتمة.','اجعلي لكل فكرة فقرة مستقلة.');
 add('الإملاء والنحو','يحتاج إلى تحقق','لا يوجد مدقق إملائي عربي حقيقي هنا، ولن أدّعي اكتشاف أخطاء غير مؤكدة.','اقرئي النص بصوت مسموع أو اطلبي مراجعة بشرية.','');
 return F}
